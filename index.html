<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Platform Admin</title>
<style>
  /* Own visual identity, not shared with check-user- — an operator should
     never be able to mistake this for a tenant's own dashboard. */
  * { box-sizing: border-box; }
  body { font-family: 'Courier New', monospace; margin: 0; background: #0d1117; color: #c9d1d9; }
  header { background: #161b22; border-bottom: 1px solid #30363d; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
  nav { display: flex; gap: 4px; padding: 12px 24px; background: #161b22; border-bottom: 1px solid #30363d; }
  nav a { padding: 8px 16px; border-radius: 6px; color: #8b949e; text-decoration: none; font-weight: 600; font-size: 13px; text-transform: uppercase; cursor: pointer; }
  nav a.active, nav a:hover { background: #1f6feb33; color: #58a6ff; }
  main { padding: 24px; max-width: 900px; margin: 0 auto; }
  .panel { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 20px; }
  .error-panel { background: #2d0f12; border-color: #6e2027; color: #ff7b72; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #21262d; }
  th { color: #8b949e; text-transform: uppercase; font-size: 11px; }
  .pill { display: inline-block; background: #1f6feb33; color: #58a6ff; border-radius: 20px; padding: 2px 10px; font-size: 11px; margin: 2px 4px 2px 0; }
  .muted { color: #6e7681; }
  .form-row { margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
  input { background: #0d1117; border: 1px solid #30363d; color: #c9d1d9; padding: 6px 10px; border-radius: 6px; font-family: inherit; }
  button { background: #238636; color: #fff; border: none; border-radius: 6px; padding: 6px 14px; cursor: pointer; font-family: inherit; }
  button.danger { background: #da3633; }
  button.outline { background: transparent; border: 1px solid #30363d; color: #c9d1d9; }
  .login-box { max-width: 320px; margin: 100px auto; background: #161b22; padding: 32px; border-radius: 10px; border: 1px solid #30363d; }
  .login-box input { width: 100%; margin-bottom: 10px; }
  .login-box button { width: 100%; }
  .error { color: #ff7b72; font-size: 13px; margin-top: 8px; }
  h2 { margin-top: 0; font-size: 15px; text-transform: uppercase; letter-spacing: 0.5px; color: #8b949e; }
  .null { color: #6e7681; }
  .thumb { max-width: 60px; max-height: 40px; border-radius: 4px; object-fit: cover; }
  .link { color: #58a6ff; }
  code { background: #0d1117; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  .directory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .directory-card { background: #0d1117; border: 1px solid #30363d; border-radius: 10px; overflow: hidden; }
  .directory-card-img { position: relative; height: 120px; background: #1c2128; }
  .directory-card-img img { width: 100%; height: 100%; object-fit: cover; }
  .directory-card-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 32px; }
  .directory-card-badge { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.6); color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 20px; }
  .directory-card-body { padding: 12px; }
  .directory-card-name { font-weight: 700; margin-bottom: 4px; }
  .directory-card-sub { font-size: 12px; color: #8b949e; margin-bottom: 6px; }
  .directory-card-desc { font-size: 12px; color: #c9d1d9; margin-bottom: 10px; }
</style>
</head>
<body>
  <div id="root"><div class="panel">Loading…</div></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/render-value.js"></script>
  <script src="js/extracted/toast.js"></script>
  <script src="js/extracted/confirm-modal.js"></script>
  <script src="js/tenants-panel.js"></script>
  <script src="js/directory-panel.js"></script>
  <script src="js/apps-catalog-panel.js"></script>
  <script src="js/connectors-catalog-panel.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
